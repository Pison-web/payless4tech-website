<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Add this in your <head> to load the icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Product Details - PAYLESS4TECH</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111631;
      background-size: cover;
      color: #ffffff;
      flex-direction: column;
      margin: 0;
      /* keep header inside the viewport */
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }  /* stops horizontal creep */

    }
    /* ===== Header / Nav ===== */
header {
  background: rgba(11,16,32,.75);
  color: #fff;
  display: flex;
  backdrop-filter: blur(10px);
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  position: fixed;  
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;      /* make sure it’s above other content */
}

header .logo {
  font-size: 22px;
  font-weight: bold;
}

header .logo span {
  color: #ffcc00;
}
main {
  flex: 1; /* pushes footer down */
}

nav {
  display: flex;
}

nav a {
  color: #fff;
  margin-left: 20px;
  text-decoration: none;
  font-size: 16px;
}

nav a.active {
  border-bottom: 2px solid #ffcc00;
  padding-bottom: 2px;
}

/* Hamburger (hidden on desktop) */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  padding: 8px;          /* bigger tap area */
  margin-left: auto;     /* sticks to the right inside header */
  z-index: 1100;         /* above dropdown */
}
.hamburger div {
  width: 25px;
  height: 3px;
  background: #fff;
  margin: 4px 0;
  border-radius: 2px;
}


/* Mobile nav (hidden by default) */
.mobile-nav {
  display: none;
  flex-direction: column;
  position: fixed;                   /* was absolute */
  top: 60px;                         /* sits just under the fixed header */
  right: 16px;                       /* pull it inside the screen edge */
  width: min(220px, calc(100vw - 32px)); /* never exceed viewport */
  background: #0b3d91;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 12px 24px rgba(0,0,0,.35);
  z-index: 1100;
}
.mobile-nav a {
  color: #fff;
  margin: 10px 0;
  text-decoration: none;
  font-size: 16px;
  white-space: nowrap;               /* links don’t wrap weirdly */
}

.details-container {
  display: flex;
  gap: 2rem;
  align-items: flex-start;
  margin: 20px;
  margin-top: 40px;   /* pushes it down */
  padding: 20px;      /* space inside the box */
  margin-left: auto;
  margin-right: auto; /* centers it */
  flex-wrap: wrap; /* ensures it wraps on small screens */
}

.details-image {
  flex: 1 1 300px; /* minimum 300px, then shrink/grow */
  display: flex;
  justify-content: center;
}

.details-image img {
  max-width: 100%;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.details-info {
  flex: 2 1 400px; /* takes more space than image */
}

.details-info h2 {
  margin-bottom: 10px;
  font-size: 1.8rem;
}

.details-info p {
  line-height: 1.6;
  margin-bottom: 15px;
}

.product-price {
  font-size: 1.5rem;
  font-weight: bold;
  margin: 15px 0;
  color: #0077cc; /* adjust to your theme */
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
}

.actions button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.actions button:hover {
  transform: translateY(-2px);
}

.actions .buy {
  display: inline-block;
  padding: 10px 18px;
  border: none;
  border-radius: 25px;  /* <-- makes buttons rounded */
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  transition: 0.3s;
  background: #28a745;
  color: white;
}

.actions .buy:hover {
  background-color: #010e1a;
  transform: translateY(-3px);   /* 👈 lift up */
  box-shadow: 0 6px 12px rgba(0,0,0,0.2);
}
.actions .fav {
  display: inline-block;
  padding: 10px 18px;
  border: none;
  border-radius: 25px;  /* <-- makes buttons rounded */
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  transition: 0.3s;
  background: #ff9800;
  color: white;
}
.actions .fav:hover {
  background-color: #010e1a;
  transform: translateY(-3px);   /* 👈 lift up */
  box-shadow: 0 6px 12px rgba(0,0,0,0.2);
}

/* ✅ Responsive: stack on small screens */
@media (max-width: 768px) {
  .details-container {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .details-info {
    flex: 1 1 auto;
    margin-top: 20px;
  }

  .actions {
    justify-content: center;
  }
}
 .details-image {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.details-image img {
  max-width: 350px;
  border-radius: 10px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.details-image img.zoomed {
  transform: scale(2);   /* zoom level */
  cursor: zoom-out;
}

.thumbnails {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.thumbnails img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border: 2px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
}

.thumbnails img:hover {
  transform: scale(1.1);
  border-color: #007bff;
}

footer {
      background: #0b3d91;
      color: white;
      text-align: center;
      padding: 15px;
      padding-bottom: 15px;
      margin-top: 30px;
    }

/* Responsive behavior */
@media (max-width: 768px) {
  nav {
    display: none;
  }
  .hamburger {
    display: flex;
  }
}
/* Lightbox overlay */
.lightbox {
  display: none; 
  position: fixed;
  z-index: 9999;
  padding: 20px;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
  cursor: zoom-out;
  transition: transform 0.3s ease;
}

.lightbox img:hover {
  transform: scale(1.05);
}

.lightbox .close {
  position: absolute;
  top: 20px;
  right: 35px;
  font-size: 40px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}

  </style>
</head>
<body>

  <!-- ===== Header / Nav ===== -->
<header>
  <div class="logo">PAYLESS<span>4TECH</span></div>

  <!-- Desktop Nav -->
  <nav id="mainNav"></nav>

  <div class="hamburger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobileNav"></div>
</header>

  <!-- MAIN PRODUCT DETAILS -->
  <main>
    <section class="product-details" id="productDetails">
      <p>Loading product details...</p>
    </section>
  </main>

   <!-- ===== Footer Placeholder ===== -->
<div id="footer-placeholder"></div>
  <script>
    // ================= CONTACT INFO =================
const CONTACT = { 
  whatsapp: '233200000000', 
  phone: '+233200000000', 
  email: 'shop@example.com', 
  businessName: 'PAYLESS' 
};

    function toggleMenu() {
      const nav = document.getElementById('mobileNav');
      nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
    }

    // Now the Account button in your navbar is dynamic:
    // If a user is logged in → clicking it sends them to user-account.html.
    // If not logged in → clicking it sends them to login/register.
    document.addEventListener("DOMContentLoaded", () => {
    const user = localStorage.getItem("paylessUser");
    const accountLink = document.getElementById("accountLink");
    if (accountLink) { // <-- check if element exists
    if (user) {
      accountLink.href = "PAYLESS4TECH-Useraccount.html"; // redirect to logged-in account page
    } else {
      accountLink.href = "PAYLESS4TECH-Account.html"; // stay login/register page
    }
  }
  });

   // Toggle mobile menu
  function toggleMenu() {
    const nav = document.getElementById("mobileNav");
    nav.style.display = nav.style.display === "flex" ? "none" : "flex";
  }

  // Build nav dynamically (desktop + mobile)
  function buildNav(container, user) {
    container.innerHTML = `
      <a href="index.html">Home 🏠︎</a>
      <a href="PAYLESS4TECH-shop.html">Shop 𖠩</a>
      <a href="favorites.html">Favorites ★</a>
      <a href="about.html">About ⓘ</a>
    `;

    if (user) {
      if (user.role === "admin") {
        container.innerHTML += `<a href="PAYLESS4TECH-Admin-dashboard.html">Admin Dashboard 🛡️</a>`;
      } else {
        container.innerHTML += `<a href="PAYLESS4TECH-Useraccount.html">Profile 𖨆</a>`;
      }
      container.innerHTML += `<a href="#" onclick="logout()">Logout ⤷</a>`;
    } else {
      container.innerHTML += `<a href="PAYLESS4TECH-Account.html">Account 👤</a>`;
    }
  }

  // Run after page loads
  document.addEventListener("DOMContentLoaded", () => {
    const user = JSON.parse(localStorage.getItem("paylessUser"));
    const mainNav = document.getElementById("mainNav");
    const mobileNav = document.getElementById("mobileNav");

    buildNav(mainNav, user);
    buildNav(mobileNav, user);
  });

  // Logout function
  function logout() {
    localStorage.removeItem("paylessUser");
    alert("Logged out!");
    window.location.href = "index.html";
  }

    // Load product details
    function loadProductDetails() {
      const productId = localStorage.getItem("selectedProductId");

      // Load both sample + admin products
const SAMPLE_PRODUCTS = [
  {id:'p1', category:'Laptop', brand:'HP', model:'EliteBook 840 G5', name:'HP EliteBook 840 G5', price:5500, currency:'GHS', img:'images/hp-elitebook.jpg', created:20240725},
  {id:'p2', category:'Laptop', brand:'Dell', model:'Latitude 7400', name:'Dell Latitude 7400', price:6200, currency:'GHS', img:'images/dell-latitude.jpg', created:20240720}
];
const ADMIN_PRODUCTS = JSON.parse(localStorage.getItem("paylessProducts") || "[]");
const ALL_PRODUCTS = [...SAMPLE_PRODUCTS, ...ADMIN_PRODUCTS];

// Now find product by ID
const product = ALL_PRODUCTS.find(p => p.id === productId);

      const detailsDiv = document.getElementById("productDetails");

      if (!product) {
  detailsDiv.innerHTML = "<p>❌ Product not found.</p>";
  return;
}

// Use multiple images if available
const images = product.images && product.images.length > 0 ? product.images : [product.img];

detailsDiv.innerHTML = `
  <div class="details-container">
    <div class="details-image">
      <!-- Main image -->
      <img id="mainImage" src="${images[0]}" alt="${product.name}">
      
      <!-- Thumbnails -->
      <div class="thumbnails">
        ${images.map(img => `<img class="thumb" src="${img}" alt="thumb">`).join("")}
      </div>
    </div>

    <div class="details-info">
      <h2>${product.name}</h2>
      <p>${product.desc || product.description || ""}</p>
      <div class="product-price">${product.price} GHS</div>
      
      <div class="actions">
        <a class="btn buy" 
          href="https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(`Hello ${CONTACT.businessName}, I'm interested in ${product.name || product.brand+" "+product.model}. Please send price & availability.`)}" 
          target="_blank" rel="noopener">Buy Now (WA)</a>
        
        <button class="btn fav ${getFavs().has(product.id) ? "active" : ""}" 
          onclick="toggleFavorite('${product.id}', this)">
          ${getFavs().has(product.id) ? "Saved" : "Save to Favorites"}
        </button>
      </div>
    </div>
  </div>
`;

// -------------------
// EXTRA BEHAVIOR
// -------------------

// Make thumbnails clickable to change main image
const mainImg = document.getElementById("mainImage");
document.querySelectorAll(".thumb").forEach(thumb => {
  thumb.addEventListener("click", () => {
    mainImg.src = thumb.src;
  });
});

// Add zoom on click/tap
if (mainImg) {
  mainImg.addEventListener("click", () => {
    if (mainImg.classList.contains("zoomed")) {
      mainImg.classList.remove("zoomed");
    } else {
      mainImg.classList.add("zoomed");
    }
  });
}
}

    // === Shared Favorites System (same as shop/home) ===
function getFavKey() {
  const user = JSON.parse(localStorage.getItem("paylessUser"));
  return user ? "favorites_" + user.email : "favorites_guest";
}
function getFavs() {
  return new Set(JSON.parse(localStorage.getItem(getFavKey()) || "[]"));
}
function saveFavs(set) {
  localStorage.setItem(getFavKey(), JSON.stringify([...set]));
}

function toggleFavorite(productId, btn) {
  const set = getFavs();
  if (set.has(productId)) {
    set.delete(productId);
    btn.textContent = "Save to Favorites";
    btn.classList.remove("active");
  } else {
    set.add(productId);
    btn.textContent = "Saved";
    btn.classList.add("active");
  }
  saveFavs(set);
}


    // Init
    document.addEventListener("DOMContentLoaded", () => {
      const user = JSON.parse(localStorage.getItem("paylessUser"));
      buildNav(document.getElementById("mainNav"), user);
      buildNav(document.getElementById("mobileNav"), user);
      loadProductDetails();
    });

    fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer-placeholder").innerHTML = data;
    })
    .catch(error => console.error("Error loading footer:", error));
  </script>

  <!-- Lightbox Overlay -->
<div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <img class="lightbox-content" id="lightboxImg" alt="zoomed image">
</div>

</body>
</html>
