<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Add this in your <head> to load the icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Forgot Password - Admin</title>
  <style>
     body {
      font-family: Arial, sans-serif;
      background: url("images/background.jpg");
      color: #e8ecf1;
      flex-direction: column;
      margin: 0;
      /* keep header inside the viewport */
* { box-sizing: border-box; 

}
html, body { overflow-x: hidden; }  /* stops horizontal creep */

    }
    /* ===== Header / Nav ===== */
header {
  background:rgba(11,16,32,.75);
  backdrop-filter: blur(10px);
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  position: fixed;  
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;      /* make sure it’s above other content */
}

header .logo {
  font-size: 22px;
  font-weight: bold;
}

header .logo span {
  color: #ffcc00;
}

nav {
  display: flex;
}

nav a {
  color: #fff;
  margin-left: 20px;
  text-decoration: none;
  font-size: 16px;
}

nav a.active {
  border-bottom: 2px solid #ffcc00;
  padding-bottom: 2px;
}

/* Hamburger (hidden on desktop) */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  padding: 8px;          /* bigger tap area */
  margin-left: auto;     /* sticks to the right inside header */
  z-index: 1100;         /* above dropdown */
}
.hamburger div {
  width: 25px;
  height: 3px;
  background: #fff;
  margin: 4px 0;
  border-radius: 2px;
}


/* Mobile nav (hidden by default) */
.mobile-nav {
  display: none;
  flex-direction: column;
  position: fixed;                   /* was absolute */
  top: 60px;                         /* sits just under the fixed header */
  right: 16px;                       /* pull it inside the screen edge */
  width: min(220px, calc(100vw - 32px)); /* never exceed viewport */
  background: #0b3d91;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 12px 24px rgba(0,0,0,.35);
  z-index: 1100;
}
.mobile-nav a {
  color: #fff;
  margin: 10px 0;
  text-decoration: none;
  font-size: 16px;
  white-space: nowrap;               /* links don’t wrap weirdly */
}
footer {
      background: #0b3d91;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }

/* Responsive behavior */
@media (max-width: 768px) {
  nav {
    display: none;
  }
  .hamburger {
    display: flex;
  }
}

    .container {
      background-color: #111631; /* panel color */
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      margin: 120px auto;  /* centers below header */
    }

    h2 {
      margin-bottom: 20px;
      color: #6ea8fe;
    }

    p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #b8c1d1;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border: none;
      border-radius: 8px;
      background-color: #0b1020;
      color: #e8ecf1;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #6ea8fe;
      color: #0b1020;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #8de1c9;
      color: #111631;
    }

    a {
      display: block;
      margin-top: 15px;
      color: #6ea8fe;
      text-decoration: none;
      font-size: 14px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- ===== Header / Nav ===== -->
<header>
  <div class="logo">PAYLESS<span>4TECH</span></div>

  <!-- Desktop Nav -->
  <nav id="mainNav"></nav>

  <div class="hamburger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobileNav"></div>
</header>
  <div class="container">
    <h2>Forgot Password</h2>
    <p>Enter your email address to reset your password.</p>
    <form>
      <input type="email" placeholder="Enter your email" required>
      <button type="submit">Reset Password</button>
    </form>
    <a href="PAYLESS4TECH-Account.html">Back to Login</a>
  </div>

  <!-- ===== Footer Placeholder ===== -->
<div id="footer-placeholder"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

   <!-- ✅ Your Script (combined nav + forgot password) -->
  <script>
    // Your Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);

    // Toggle mobile menu
    function toggleMenu() {
      const nav = document.getElementById("mobileNav");
      nav.style.display = nav.style.display === "flex" ? "none" : "flex";
    }

    // Build nav dynamically
    function buildNav(container, user) {
      container.innerHTML = `
        <a href="index.html">Home 🏠︎</a>
        <a href="PAYLESS4TECH-shop.html">Shop 𖠩</a>
        <a href="favorites.html">Favorites ★</a>
        <a href="about.html">About ⓘ</a>
      `;

      if (user) {
        if (user.role === "admin") {
          container.innerHTML += `<a href="PAYLESS4TECH-Admin-dashboard.html">Admin Dashboard 🛡️</a>`;
        } else {
          container.innerHTML += `<a href="PAYLESS4TECH-Useraccount.html">Profile 𖨆</a>`;
        }
        container.innerHTML += `<a href="#" onclick="logout()">Logout ⤷</a>`;
      } else {
        container.innerHTML += `<a href="PAYLESS4TECH-Account.html">Account 👤</a>`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const user = JSON.parse(localStorage.getItem("paylessUser"));
      const mainNav = document.getElementById("mainNav");
      const mobileNav = document.getElementById("mobileNav");

      buildNav(mainNav, user);
      buildNav(mobileNav, user);

      // Forgot password handler
      document.querySelector("form").addEventListener("submit", function(e) {
        e.preventDefault();
        const email = document.querySelector("input[type='email']").value;

        firebase.auth().sendPasswordResetEmail(email)
          .then(() => {
            alert("Password reset email sent! Check your inbox.");
          })
          .catch(error => {
            alert("Error: " + error.message);
          });
      });
    });

    // Logout function
    function logout() {
      localStorage.removeItem("paylessUser");
      alert("Logged out!");
      window.location.href = "index.html";
    }

    fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer-placeholder").innerHTML = data;
    })
    .catch(error => console.error("Error loading footer:", error));
  </script>
</body>
</html>
