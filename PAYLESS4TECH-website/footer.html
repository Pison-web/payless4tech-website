<style>
  /* ===== Footer Styles ===== */
  .site-footer {
    background-color: #0b1020; /* matches your header dark blue */
    color: #fff;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
  }

  .footer-container {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
  }

  .footer-column {
    flex: 1;
    min-width: 180px;
    margin-bottom: 20px;
  }

  .footer-column h4 {
    font-size: 15px;
    margin-bottom: 12px;
    font-weight: bold;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .footer-column ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .footer-column ul li {
    margin-bottom: 8px;
  }

  .footer-column ul li a {
    color: #bbb;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.3s;
  }

  .footer-column ul li a:hover {
    color: #fdec02;
  }

  /* Social icons */
  .footer-social {
    margin-top: 10px;
  }

  .footer-social a {
    display: inline-block;
    margin-right: 10px;
    color: #ffffff;
    font-size: 18px;
    transition: color 0.3s;
  }

  .footer-social a:hover {
    color: #fdec02;
  }

  .footer-bottom {
    border-top: 1px solid #333;
    margin-top: 20px;
    padding-top: 15px;
    text-align: center;
    font-size: 13px;
    color: #aaa;
  }

  /* ===== Responsive ===== */
  @media (max-width: 768px) {
    .footer-container {
      flex-direction: column;
      align-items: flex-start;
    }

    .footer-column {
      width: 100%;
    }
  }

</style>
