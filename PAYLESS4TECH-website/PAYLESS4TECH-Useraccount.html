<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Add this in your <head> to load the icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>PAYLESS4TECH - User Account</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url("images/background.jpg");
      background-size: cover;
      color: #e8ecf1;
      flex-direction: column;
      margin: 0;
      /* keep header inside the viewport */
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }  /* stops horizontal creep */

    }
    /* ===== Header / Nav ===== */
header {
  background:rgba(11,16,32,.75);
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  position: fixed;  
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;      /* make sure it’s above other content */
}

header .logo {
  font-size: 22px;
  font-weight: bold;
}

header .logo span {
  color: #ffcc00;
}

nav {
  display: flex;
}

nav a {
  color: #fff;
  margin-left: 20px;
  text-decoration: none;
  font-size: 16px;
}

nav a.active {
  border-bottom: 2px solid #ffcc00;
  padding-bottom: 2px;
}

/* Hamburger (hidden on desktop) */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  padding: 8px;          /* bigger tap area */
  margin-left: auto;     /* sticks to the right inside header */
  z-index: 1100;         /* above dropdown */
}
.hamburger div {
  width: 25px;
  height: 3px;
  background: #fff;
  margin: 4px 0;
  border-radius: 2px;
}


/* Mobile nav (hidden by default) */
.mobile-nav {
  display: none;
  flex-direction: column;
  position: fixed;                   /* was absolute */
  top: 60px;                         /* sits just under the fixed header */
  right: 16px;                       /* pull it inside the screen edge */
  width: min(220px, calc(100vw - 32px)); /* never exceed viewport */
  background: #0b3d91;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 12px 24px rgba(0,0,0,.35);
  z-index: 1100;
}
.mobile-nav a {
  color: #fff;
  margin: 10px 0;
  text-decoration: none;
  font-size: 16px;
  white-space: nowrap;               /* links don’t wrap weirdly */
}
footer {
      background: #0b3d91;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }

/* Responsive behavior */
@media (max-width: 768px) {
  nav {
    display: none;
  }
  .hamburger {
    display: flex;
  }
}

    /* Content Sections */
    .container {
      padding: 20px;
      margin: 120px auto;  /* centers below header */
    }

    .card {
      background: #111631;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      width: 500px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .card h3 {
      margin-top: 0;
      color: #6ea8fe;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #6ea8fe;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover {
      background: #568bdb;
    }

    .profile-pic-container {
  text-align: center;
  margin-bottom: 15px;
}

.profile-pic-container img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid #007bff;
  margin-bottom: 8px;
}

#changePicBtn {
  padding: 6px 12px;
  font-size: 0.9em;
  cursor: pointer;
  border: none;
  background: #007bff;
  color: white;
  border-radius: 6px;
  transition: background 0.3s;
}

#changePicBtn:hover {
  background: #0056b3;
}

  </style>
</head>
<body>
<!-- ===== Header / Nav ===== -->
<header>
  <div class="logo">PAYLESS<span>4TECH</span></div>

  <!-- Desktop Nav -->
  <nav id="mainNav"></nav>

  <div class="hamburger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobileNav"></div>
</header>

  <div class="container">
  <!-- Profile -->
  <div class="card" id="profileHeader">
    
    <!-- Profile picture -->
    <div class="profile-pic-container">
      <img id="profilePic" src="images/default-avatar.png" alt="Profile Picture">
      <canvas id="avatarCanvas" width="120" height="120" style="display:none;"></canvas>
      <input type="file" id="uploadPic" accept="image/*" style="display:none;">
      <button id="changePicBtn">Change Picture</button>
      <button id="removePicBtn" style="display:none;">Remove Picture</button>
    </div>

    <h3 id="fullName">Full Name</h3>
    <h5><p id="smallUsername">@username</p></h5>
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Phone:</strong> <span id="phone"></span></p>
  </div>
</div>


    <!-- Saved Items -->
<div class="card" id="userFavorites">
  <h2>✮ My Favorites</h2>
  <p>You haven’t saved anything yet.</p>
</div>
</div>
  
<!-- ===== Footer Placeholder ===== -->
<div id="footer-placeholder"></div>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  // ---------- Auth check ----------
  // Load user info
const user = JSON.parse(localStorage.getItem("paylessUser"));
if (!user) {
  alert("Please login or register first.");
  window.location.href = "PAYLESS4TECH-Account.html"; 
} else {
  // Full name
  const fullName = `${user.first || ""} ${user.last || ""}`.trim();
  document.getElementById("fullName").textContent = fullName || user.username;
  document.getElementById("smallUsername").textContent = `@ ${user.username}`;
  document.getElementById("email").textContent = user.email;
  document.getElementById("phone").textContent = user.phone || "Not provided";

  const profilePicEl = document.getElementById("profilePic");
  const uploadPicInput = document.getElementById("uploadPic");
  const changePicBtn = document.getElementById("changePicBtn");
  const removePicBtn = document.getElementById("removePicBtn");
  const defaultAvatar = "images/default-avatar.png";

  // Profile picture (uploaded, initials, or default)
  if (user.profilePic) {
    profilePicEl.src = user.profilePic;
    removePicBtn.style.display = "inline-block"; // show remove if custom pic exists
  } else {
    generateInitialsAvatar(user);
    removePicBtn.style.display = "none";
  }

  // Change picture logic
  changePicBtn.addEventListener("click", () => {
    uploadPicInput.click();
  });

  uploadPicInput.addEventListener("change", function () {
    const file = this.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        const imgData = e.target.result;
        profilePicEl.src = imgData;

        // Save inside user object
        user.profilePic = imgData;
        localStorage.setItem("paylessUser", JSON.stringify(user));

        removePicBtn.style.display = "inline-block"; // show remove button
      };
      reader.readAsDataURL(file);
    }
  });

  // Remove picture logic → reset instantly
  removePicBtn.addEventListener("click", () => {
    // Clear saved picture
    delete user.profilePic;
    localStorage.setItem("paylessUser", JSON.stringify(user));

    // Instantly regenerate initials avatar (instead of page reload)
    generateInitialsAvatar(user);

    uploadPicInput.value = ""; 
    removePicBtn.style.display = "none"; 
  });
}

// --- Generate initials avatar if no profilePic ---
function generateInitialsAvatar(user) {
  const canvas = document.getElementById("avatarCanvas");
  const ctx = canvas.getContext("2d");
  const size = canvas.width;

  // Background color
  ctx.fillStyle = "#007bff";
  ctx.fillRect(0, 0, size, size);

  // Initials
  const first = (user.first || "").charAt(0).toUpperCase();
  const last = (user.last || "").charAt(0).toUpperCase();
  const initials = (first + last) || user.username.charAt(0).toUpperCase();

  ctx.fillStyle = "white";
  ctx.font = "bold 48px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(initials, size / 2, size / 2);

  // Convert to image
  const dataUrl = canvas.toDataURL("image/png");
  document.getElementById("profilePic").src = dataUrl;
}


  // ---------- Products sources ----------
  // keep the same sample products you already use elsewhere
  const SAMPLE_PRODUCTS = [
    {id:'p1', name:'HP EliteBook 840 G5', brand:'HP', model:'EliteBook 840 G5', price:5500, currency:'GHS', img:'images/hp-elitebook.jpg', desc: ''},
    {id:'p2', name:'Dell Latitude 7400', brand:'Dell', model:'Latitude 7400', price:6200, currency:'GHS', img:'images/dell-latitude.jpg', desc: ''},
    {id:'p3', name:'Lenovo ThinkPad T480', brand:'Lenovo', model:'ThinkPad T480', price:4999, currency:'GHS', img:'images/lenovo-thinkpad.jpg', desc: ''},
    {id:'p4', name:'HP Original Charger', brand:'HP', model:'Original Charger', price:250, currency:'GHS', img:'images/hp-charger.jpg', desc: ''},
    {id:'p5', name:'HP EliteBook Battery', brand:'HP', model:'EliteBook Battery', price:450, currency:'GHS', img:'images/hp-battery.jpg', desc: ''},
    {id:'p6', name:'8GB DDR4 RAM', brand:'Generic', model:'8GB DDR4 RAM', price:320, currency:'GHS', img:'images/ram-8gb.jpg', desc: ''}
  ];

  function normalizeProduct(p) {
    return {
      id: p.id,
      name: p.name || `${p.brand || ''} ${p.model || ''}`.trim(),
      desc: p.desc || p.description || '',
      price: (typeof p.price === 'number') ? p.price : parseFloat(p.price) || 0,
      currency: p.currency || 'GHS',
      images: p.images || (p.img ? [p.img] : []),
      img: (p.images && p.images.length > 0) ? p.images[0] : (p.img || 'images/placeholder.png')
    };
  }

  // ---------- Favorites storage helpers ----------
  function getFavKey() {
    const u = JSON.parse(localStorage.getItem('paylessUser'));
    return u ? 'favorites_' + u.email : 'favorites_guest';
  }
  const getFavsArray = () => JSON.parse(localStorage.getItem(getFavKey()) || '[]');
  const getFavsSet = () => new Set(getFavsArray());
  const saveFavsFromSet = (set) => localStorage.setItem(getFavKey(), JSON.stringify(Array.from(set)));

  // ---------- rendering ----------
  const favWrapper = document.getElementById('userFavorites'); // your div with id="userFavorites"
  function fmt(price, cur='GHS') {
    return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(price);
  }
  function truncateText(text, limit=90) {
    if (!text) return '';
    return text.length > limit ? text.slice(0, limit) + '…' : text;
  }

  function loadAllProducts() {
    // Always read admin products fresh from localStorage so changes show up immediately
    const admin = JSON.parse(localStorage.getItem('paylessProducts') || '[]');
    const merged = [...SAMPLE_PRODUCTS, ...admin].map(normalizeProduct);
    return merged;
  }

  function renderUserFavorites() {
    const favIds = getFavsArray();
    if (!favWrapper) return;

    if (!favIds || favIds.length === 0) {
      favWrapper.innerHTML = '<h2>✮ My Favorites</h2><p>You haven’t saved anything yet.</p>';
      return;
    }

    const ALL = loadAllProducts();
    // container header
    favWrapper.innerHTML = '<h2>✮ My Favorites</h2>';
    const grid = document.createElement('div');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(220px, 1fr))';
    grid.style.gap = '12px';
    grid.style.marginTop = '12px';

    favIds.forEach(id => {
      const p = ALL.find(x => x.id === id);
      if (!p) {
        // product removed — skip gracefully
        return;
      }

      const card = document.createElement('div');
      card.className = 'fav-card';
      // lightweight styles so it looks okay immediately
      card.style.border = '1px solid rgba(255,255,255,0.06)';
      card.style.background = 'rgba(255,255,255,0.02)';
      card.style.padding = '10px';
      card.style.borderRadius = '8px';
      card.style.cursor = 'pointer';
      card.style.display = 'flex';
      card.style.flexDirection = 'column';
      card.style.gap = '8px';

      const img = document.createElement('img');
      img.src = p.img || 'images/placeholder.png';
      img.alt = p.name || '';
      img.style.width = '100%';
      img.style.height = '150px';
      img.style.objectFit = 'cover';
      img.style.borderRadius = '6px';
      card.appendChild(img);

      const h = document.createElement('h4');
      h.textContent = p.name || 'Product';
      h.style.margin = '0';
      card.appendChild(h);

      if (p.desc) {
        const desc = document.createElement('div');
        desc.textContent = truncateText(p.desc, 80);
        desc.style.fontSize = '0.9rem';
        desc.style.color = 'rgba(255,255,255,0.9)';
        card.appendChild(desc);
      }

      const price = document.createElement('div');
      price.textContent = fmt(p.price, p.currency);
      price.style.fontWeight = '700';
      card.appendChild(price);

      const row = document.createElement('div');
      row.style.display = 'flex';
      row.style.gap = '8px';
      row.style.marginTop = 'auto';

      const viewBtn = document.createElement('button');
      viewBtn.textContent = 'View Details';
      viewBtn.className = 'btn';
      viewBtn.style.flex = '1';
      viewBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        localStorage.setItem('selectedProductId', p.id);
        window.location.href = 'product-details.html';
      });

      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'Remove';
      removeBtn.className = 'btn';
      removeBtn.style.flex = '1';
      removeBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        removeFromFavorites(p.id);
      });

      row.appendChild(viewBtn);
      row.appendChild(removeBtn);
      card.appendChild(row);

      // clicking the card (not the buttons) also opens details
      card.addEventListener('click', (ev) => {
        const tag = ev.target.tagName.toLowerCase();
        if (tag === 'button' || ev.target.closest('button')) return;
        localStorage.setItem('selectedProductId', p.id);
        window.location.href = 'product-details.html';
      });

      grid.appendChild(card);
    });

    favWrapper.appendChild(grid);
  }

  // ---------- remove ----------
  function removeFromFavorites(id) {
    const key = getFavKey();
    const arr = JSON.parse(localStorage.getItem(key) || '[]');
    const filtered = arr.filter(x => x !== id);
    localStorage.setItem(key, JSON.stringify(filtered));
    // re-render in-place
    renderUserFavorites();
    // notify other tabs (optional) — localStorage write already triggers storage event on other tabs
  }

  // ---------- keep in sync when products or favorites change in other tabs ----------
  window.addEventListener('storage', (e) => {
    if (!e.key) return;
    if (e.key === 'paylessProducts' || e.key.startsWith('favorites_')) {
      renderUserFavorites();
    }
  });

  // ---------- nav + helpers (safe to include) ----------
  function toggleMenu() {
    const nav = document.getElementById('mobileNav');
    if (!nav) return;
    nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
  }

  function buildNav(container, userObj) {
    if (!container) return;
    container.innerHTML = `
      <a href="index.html">Home 🏠︎</a>
      <a href="PAYLESS4TECH-shop.html">Shop 𖠩</a>
      <a href="favorites.html">Favorites ★</a>
      <a href="about.html"><About ⓘ/a>
    `;
    if (userObj) {
      if (userObj.role === 'admin') container.innerHTML += `<a href="PAYLESS4TECH-Admin-dashboard.html"></a>Admin Dashboard 🛡️`;
      else container.innerHTML += `<a href="PAYLESS4TECH-Useraccount.html">Profile 𖨆</a>`;
      container.innerHTML += `<a href="#" onclick="logout()">Logout ⤷</a>`;
    } else {
      container.innerHTML += `<a href="PAYLESS4TECH-Account.html">Account 👤</a>`;
    }
  }

  // run nav builds if the elements exist
  const mainNav = document.getElementById('mainNav');
  const mobileNav = document.getElementById('mobileNav');
  buildNav(mainNav, user);
  buildNav(mobileNav, user);

  // logout (exposed globally)
  window.logout = function() {
    localStorage.removeItem('paylessUser');
    alert('Logged out!');
    window.location.href = 'index.html';
  };

  // expose toggleMenu
  window.toggleMenu = toggleMenu;

  // initial render
  renderUserFavorites();
});

fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer-placeholder").innerHTML = data;
    })
    .catch(error => console.error("Error loading footer:", error));
</script>

</body>
</html>
