<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Add this in your <head> to load the icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>My Favorites - PayLess</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      background-size: cover;
      color: #e8ecf1;
      flex-direction: column;
      margin: 0;
      /* keep header inside the viewport */
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }  /* stops horizontal creep */

    }
    /* ===== Header / Nav ===== */
header {
  background:rgba(11,16,32,.75);
  backdrop-filter: blur(10px);
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  position: fixed;  
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;      /* make sure it’s above other content */
}

header .logo {
  font-size: 22px;
  font-weight: bold;
}

header .logo span {
  color: #ffcc00;
}

nav {
  display: flex;
}

nav a {
  color: #fff;
  margin-left: 20px;
  text-decoration: none;
  font-size: 16px;
}

nav a.active {
  border-bottom: 2px solid #ffcc00;
  padding-bottom: 2px;
}

/* Hamburger (hidden on desktop) */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  padding: 8px;          /* bigger tap area */
  margin-left: auto;     /* sticks to the right inside header */
  z-index: 1100;         /* above dropdown */
}
.hamburger div {
  width: 25px;
  height: 3px;
  background: #fff;
  margin: 4px 0;
  border-radius: 2px;
}


/* Mobile nav (hidden by default) */
.mobile-nav {
  display: none;
  flex-direction: column;
  position: fixed;                   /* was absolute */
  top: 60px;                         /* sits just under the fixed header */
  right: 16px;                       /* pull it inside the screen edge */
  width: min(220px, calc(100vw - 32px)); /* never exceed viewport */
  background: #0b3d91;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 12px 24px rgba(0,0,0,.35);
  z-index: 1100;
}
.mobile-nav a {
  color: #fff;
  margin: 10px 0;
  text-decoration: none;
  font-size: 16px;
  white-space: nowrap;               /* links don’t wrap weirdly */
}
footer {
      background: #0b3d91;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }

/* Responsive behavior */
@media (max-width: 768px) {
  nav {
    display: none;
  }
  .hamburger {
    display: flex;
  }
}
    .favorites-container {
      max-width: 1000px;
      padding: 20px;
      margin: 120px auto;  /* centers below header */
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .favorite-item {
      background: var(--panel, #111631);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.3);
      text-align: center;
    }
    .favorite-item img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .favorite-item h3 {
      margin: 10px 0;
      font-size: 18px;
    }
    .favorite-item p {
      font-size: 14px;
      margin-bottom: 5px;
    }

    .favorite-content {
  display: flex;
  align-items: center;
  gap: 20px;
  text-align: left; /* text aligns nicely */
}

.favorite-image img {
  width: 160px;
  height: auto;
  border-radius: 8px;
  object-fit: cover;
}

.favorite-details {
  flex: 1; /* take up remaining space */
}

  </style>
</head>
<body>
  <!-- ===== Header / Nav ===== -->
<header>
  <div class="logo">PAYLESS<span>4TECH</span></div>

  <!-- Desktop Nav -->
  <nav id="mainNav"></nav>

  <div class="hamburger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobileNav"></div>
</header>
  <div class="favorites-container">
    <h2>My Favorites ✩</h2>
    <div id="favoritesList" class="favorites-grid">
      <!-- Favorite items will be loaded here -->
    </div>
  </div>

  <!-- ===== Footer Placeholder ===== -->
<div id="footer-placeholder"></div>
  <script>
  // --- same PRODUCTS array as in shop.js ---
  const PRODUCTS = [
    {id:'p1', category:'Laptop', brand:'HP', model:'EliteBook 840 G5', name:'HP EliteBook 840 G5', cpu:'i5-8350U', ram:'8GB', storage:'256GB SSD', screen:'14" FHD', price:5500, currency:'GHS', img:'images/hp-elitebook.jpg', created:20240725},
    {id:'p2', category:'Laptop', brand:'Dell', model:'Latitude 7400', name:'Dell Latitude 7400', cpu:'i7-8665U', ram:'16GB', storage:'512GB SSD', screen:'14" FHD', price:6200, currency:'GHS', img:'images/dell-latitude.jpg', created:20240720},
    {id:'p3', category:'Laptop', brand:'Lenovo', model:'ThinkPad T480', name:'Lenovo ThinkPad T480', cpu:'i5-8350U', ram:'16GB', storage:'512GB SSD', screen:'14" FHD', price:4999, currency:'GHS', img:'images/lenovo-thinkpad.jpg', created:20240810},
    {id:'p4', category:'Accessory', brand:'HP', model:'Original Charger', name:'HP Original Charger', subcat:'Charger', price:250, currency:'GHS', img:'images/hp-charger.jpg', created:20240901},
    {id:'p5', category:'Accessory', brand:'HP', model:'EliteBook Battery', name:'HP EliteBook Battery', subcat:'Battery', price:450, currency:'GHS', img:'images/hp-battery.jpg', created:20240902},
    {id:'p6', category:'Accessory', brand:'Generic', model:'8GB DDR4 RAM', name:'8GB DDR4 RAM', subcat:'RAM', price:320, currency:'GHS', img:'images/ram-8gb.jpg', created:20240903}
  ];

  // format price helper
  const fmt = (price, cur='GHS') => new Intl.NumberFormat(undefined, {
    style: 'currency',
    currency: cur,
    maximumFractionDigits: 0
  }).format(price);

  // lookup helper (static + admin products)
function getProductById(id) {
  // Load admin products
  const adminProducts = JSON.parse(localStorage.getItem("paylessProducts")) || [];

  // Merge both sources
  const allProducts = [...PRODUCTS, ...adminProducts];

  // Find by id
  return allProducts.find(p => p.id === id);
}


  document.addEventListener("DOMContentLoaded", function () {
    // Ensure user is logged in
    const paylessUser = JSON.parse(localStorage.getItem("paylessUser"));
    if (!paylessUser) {
      alert("Please login or register to view your favorites.");
      window.location.href = "PAYLESS4TECH-Account.html"; 
      return;
    }

    // Load favorites (IDs only)
    let favorites = JSON.parse(localStorage.getItem("favorites_" + paylessUser.email)) || [];
    const favoritesList = document.getElementById("favoritesList");

    if (favorites.length === 0) {
      favoritesList.innerHTML = "<p>You haven’t added any favorites yet.</p>";
      return;
    }

    // Render each favorite using PRODUCTS data
    favorites.forEach(fid => {
      const p = getProductById(fid);
      if (!p) return; // skip missing

      const itemDiv = document.createElement("div");
      itemDiv.classList.add("favorite-item");

      itemDiv.innerHTML = `
  <div class="favorite-content fav-clickable">
  <div class="favorite-image">
    <img src="${(p.images && p.images.length > 0) ? p.images[0] : p.img}" alt="${p.name}">
  </div>
  <div class="favorite-details">
    <h3>${p.name}</h3>
    <p><strong>Price:</strong> ${fmt(p.price, p.currency)}</p>
    <button onclick="removeFromFavorites('${p.id}'); event.stopPropagation();">Remove</button>
  </div>
</div>
`;


// make the whole div clickable → go to details
itemDiv.querySelector('.fav-clickable').addEventListener('click', () => {
  localStorage.setItem("selectedProductId", p.id);
  window.location.href = "product-details.html";
});

      favoritesList.appendChild(itemDiv);
    });
  });

  // Remove favorite and update storage
  function removeFromFavorites(id) {
    const paylessUser = JSON.parse(localStorage.getItem("paylessUser"));
    let favorites = JSON.parse(localStorage.getItem("favorites_" + paylessUser.email)) || [];
    const updatedFavorites = favorites.filter(fid => fid !== id);
    localStorage.setItem("favorites_" + paylessUser.email, JSON.stringify(updatedFavorites));
    location.reload();
  }

  // React to favorites changes across pages
  window.addEventListener("storage", (e) => {
    if (e.key && e.key.startsWith("favorites_")) {
      location.reload(); // simple refresh to update
    }
  });

  // nav
  function toggleMenu() {
  const nav = document.getElementById('mobileNav');
  nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
}

// Toggle mobile menu
  function toggleMenu() {
    const nav = document.getElementById("mobileNav");
    nav.style.display = nav.style.display === "flex" ? "none" : "flex";
  }

  // Build nav dynamically (desktop + mobile)
  function buildNav(container, user) {
    container.innerHTML = `
      <a href="index.html">Home 🏠︎</a>
      <a href="PAYLESS4TECH-shop.html">Shop 𖠩</a>
      <a href="favorites.html">Favorites ★</a>
      <a href="about.html">About ⓘ</a>
    `;

    if (user) {
      if (user.role === "admin") {
        container.innerHTML += `<a href="PAYLESS4TECH-Admin-dashboard.html">Admin Dashboard 🛡️</a>`;
      } else {
        container.innerHTML += `<a href="PAYLESS4TECH-Useraccount.html">Profile 𖨆</a>`;
      }
      container.innerHTML += `<a href="#" onclick="logout()">Logout ⤷</a>`;
    } else {
      container.innerHTML += `<a href="PAYLESS4TECH-Account.html">Account 👤</a>`;
    }
  }

  // Run after page loads
  document.addEventListener("DOMContentLoaded", () => {
    const user = JSON.parse(localStorage.getItem("paylessUser"));
    const mainNav = document.getElementById("mainNav");
    const mobileNav = document.getElementById("mobileNav");

    buildNav(mainNav, user);
    buildNav(mobileNav, user);
  });

  // Logout function
  function logout() {
    localStorage.removeItem("paylessUser");
    alert("Logged out!");
    window.location.href = "index.html";
  }

  fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer-placeholder").innerHTML = data;
    })
    .catch(error => console.error("Error loading footer:", error));
</script>
</body>
</html>
