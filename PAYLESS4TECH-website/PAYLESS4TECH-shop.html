<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop - PAYLESS4TECH</title>
  <meta name="description" content="All products — laptops and accessories. Contact to order via WhatsApp, call or email." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Add this in your <head> to load the icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--panel:#0f1a36;--muted:#b8c1d1;--text:#e8ecf1;--primary:#6ea8fe;--border:#20284a}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    a{color:inherit}
    img{max-width:100%;display:block}

    .container{width:min(1200px,92%);margin-inline:auto}
    header{background:rgba(11,16,32,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 0;position:relative}
    .brand{display:flex;align-items:center;gap:10px; 
    .brand-title {
  font-weight: 700;
  font-size: 18px;
}

.brand-title span {
  color: #ffcc00; /* gold for 4TECH */
}

.logo a {
  display: inline-block;
  height: 40px;
  width: 40px;
  background: url("images/payless4techlogo.jpg") no-repeat center center;
  background-size: contain;
  text-indent: -9999px;  /* hides the text when logo loads */
}

.logo a::before {
  content: "PL"; /* fallback text */
  color: #333;   /* show only if image fails */
  text-indent: 0;
}

}
    .logo{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),#8de1c9);border-radius:10px;display:grid;place-items:center;font-weight:800;color:#071029}
    .nav-links{display:flex;gap:12px;align-items:center}
    .nav-links a{padding:8px 12px;border-radius:999px;border:1px solid transparent}
    .nav-links a:hover{background:#6c8bfc;border-color:var(--border)}
    .menu-toggle{display:none;cursor:pointer;font-size:22px;padding:6px 8px;border-radius:8px}
    @media(max-width:560px){
      .nav-links{display:none;flex-direction:column;gap:0;position:absolute;top:64px;right:12px;background:#0f1734;border:1px solid var(--border);border-radius:12px;overflow:hidden;min-width:160px;z-index:40}
      .nav-links a{display:block;padding:12px 16px;border-bottom:1px solid var(--border)}
      .nav-links a:last-child{border-bottom:none}
      .nav-links.show{display:flex}
      /* Remove old .menu-toggle rules and add: */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
}

.hamburger span {
  width: 25px;
  height: 3px;
  background: var(--text);
  margin: 4px 0;
  border-radius: 3px;
}
/* Mobile only */
@media(max-width:560px) {
  .nav-links {
    display: none;
    flex-direction: column;
    gap: 0;
    position: absolute;
    top: 64px;
    right: 12px;
    background: #0f1734;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    min-width: 160px;
    z-index: 40;
  }

  .nav-links.show {
    display: flex;
  }

  .hamburger {
    display: flex;
  }
}


    }

    main{padding:24px 0}
    h1{margin:6px 0 10px}
    .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}
    .search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:#0f1734;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
    .search input{all:unset;color:var(--text);flex:1}
    .chip{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:#0f1734;color:var(--muted);cursor:pointer}
    .chip.active{border-color:var(--primary);color:var(--text)}
    .select{background:#0f1734;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px}

    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:560px){.grid{grid-template-columns:1fr}}

    .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column}
    .card img{width:100%;height:160px;object-fit:contain;border-radius:8px;background:#0b1230}
    .card h3{margin:10px 0 6px;font-size:16px}
    .meta{color:var(--muted);font-size:13px;margin-bottom:8px}
    .price{font-weight:700;margin-bottom:8px}
    .actions{display:flex;gap:8px;margin-top:auto}
    .btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0f1734;color:var(--text);text-align:center}
    .btn.primary{background:var(--primary);color:#0b1020;font-weight:700}

    /* --- ensure menu-toggle shows on mobile and .nav-links.show is honored --- */
@media (max-width: 560px) {
  .menu-toggle {
    display: block;
    color: var(--text);
    background: #0f1734;
    border: 1px solid transparent;
    padding: 6px 8px;
    border-radius: 8px;
  }

  /* defensive: make sure the nav-links are hidden by default and shown when .show exists */
  .nav-links { display: none; }
  .nav-links.show {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
}


    footer{color:var(--muted);padding:24px 0;border-top:1px solid var(--border);margin-top:18px}
  </style>
</head>
<body>
  <header>
  <div class="container nav">
    <div class="brand">
      <div class="logo"><a href="index.html">PL</a></div>
      <div class="brand-title">PAYLESS<span>4TECH</span></div>
    </div>

    <!-- Same toggle button as homepage -->
    <div class="menu-toggle" id="menuToggle" aria-label="Toggle menu" aria-expanded="false">☰</div>

    <!-- Same nav as homepage -->
    <nav class="nav-links" id="navLinks" aria-label="primary">
      <a href="index.html">Home</a>
      <a href="PAYLESS4TECH-shop.html" class="active">Shop</a>
      <a href="favorites.html" id="favLink">Favorites</a>
      <a id="accountLink" href="PAYLESS4TECH-Account.html">Account</a>
      <a href="about.html">About</a>
    </nav>

  </div>
</header>


  <main class="container">
    <h1>All Products</h1>
    <p style="color:var(--muted);margin-top:4px">
      Browse all available laptops and accessories. Prices are in <strong>GHS</strong>.
    </p>

    <!-- === Toolbar === -->
    <section class="toolbar" aria-label="filters">
      <div class="search" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="q" type="text" placeholder="Search by brand, model, or keyword" aria-label="Search products" />
      </div>

      <div style="display:flex;gap:8px;align-items:center">
        <select id="category" class="select" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option value="Laptop">Laptops</option>
          <option value="Accessory">Accessories</option>
          <option value="Phones">Phones</option>
          <option value="Battery">Battery</option>
          <option value="RAM">RAM</option>
        </select>
        <select id="sort" class="select" aria-label="Sort products">
          <option value="new">Newest</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>
    </section>

    <section class="grid" id="productGrid" aria-live="polite"></section>

    <footer>
      <div class="container">
        <div>
          Contact: <a id="waFooter" href="#">WhatsApp</a> •
          <a id="telFooter" href="#">Call</a> •
          <a id="mailFooter" href="#">Email</a>
        </div>
        <div style="margin-top:8px">© <span id="yr"></span> PAYLESS-4TECH</div>
      </div>
    </footer>
  </main>

  <a class="btn primary" id="waFloat" style="position:fixed;right:16px;bottom:16px;border-radius:999px;padding:14px 16px;z-index:60;background:#25D366;color:#071029;font-weight:700;text-decoration:none;">WhatsApp Order</a>
  
  <!-- ===== Company Info Footer ===== -->
<div id="footer-placeholder"></div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    fetch("footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  });
</script>

  <script>
    
// ================= CONTACT INFO =================
    const CONTACT = { whatsapp: '233200000000', phone: '+233200000000', email: 'shop@example.com', businessName: 'PAYLESS' };

    // ================= PRODUCTS =================
// Start with some sample products (optional)
const SAMPLE_PRODUCTS = [
  {id:'p1', category:'Laptop', brand:'HP', model:'EliteBook 840 G5', name:'HP EliteBook 840 G5', price:5500, currency:'GHS', img:'images/hp-elitebook.jpg', created:20240725},
  {id:'p2', category:'Laptop', brand:'Dell', model:'Latitude 7400', name:'Dell Latitude 7400', price:6200, currency:'GHS', img:'images/dell-latitude.jpg', created:20240720}
];

// Load admin-added products
const ADMIN_PRODUCTS = JSON.parse(localStorage.getItem("paylessProducts") || "[]");

// Merge sample + admin uploads
// Use admin products if available, otherwise fall back to sample
const PRODUCTS = ADMIN_PRODUCTS.length > 0 ? ADMIN_PRODUCTS : SAMPLE_PRODUCTS;


    // ================= FAVORITES =================
    function getFavKey() {
      const user = JSON.parse(localStorage.getItem("paylessUser"));
      return user ? "favorites_" + user.email : "favorites_guest";
    }
    const getFavs = () => new Set(JSON.parse(localStorage.getItem(getFavKey()) || "[]"));
    const saveFavs = (set) => localStorage.setItem(getFavKey(), JSON.stringify(Array.from(set)));

    // ================= HELPERS =================
    const fmt = (price, cur='GHS') => new Intl.NumberFormat(undefined,{style:'currency',currency:cur, maximumFractionDigits:0}).format(price);
    const el = (tag, cls) => { const n = document.createElement(tag); if(cls) n.className = cls; return n; };

    // ================= TRUNCATE TEXT =================
function truncateText(text, limit) {
  if (!text) return "";
  return text.length > limit ? text.substring(0, limit) + "…" : text;
}

   // ================= RENDER PRODUCTS =================
const grid = document.getElementById("productGrid");
const searchInput = document.getElementById("q");
const categorySel = document.getElementById("category");
const sortSel = document.getElementById("sort");

function render(list){
  grid.innerHTML = "";
  const favs = getFavs();
  list.forEach(p=>{
    const card = el("article","card");
       const img = el("img");
    img.src = (p.images && p.images.length > 0) ? p.images[0] : p.img;
    img.alt = p.name || p.model;
    card.appendChild(img);


    const title = el("h3"); 
    title.textContent = p.name || `${p.brand} ${p.model}`; 
    card.appendChild(title);

    if(p.brand) { 
      const meta = el("div","meta"); 
      meta.textContent = `${p.brand} ${p.model ? " • "+p.model : ""}`; 
      card.appendChild(meta); 
    }

    if(p.subcat) { 
      const sub = el("div","meta");
      sub.textContent = `Category: ${p.subcat}`; 
      card.appendChild(sub); 
    }

    // Description (from admin dashboard)
    // Short description (truncate for shop view)
if (p.desc) {
  const desc = el("div","desc");
  desc.textContent = truncateText(p.desc.replace(/\n/g, " "), 80); 
  card.appendChild(desc);
}


    const price = el("div","price"); 
    price.textContent = fmt(p.price, p.currency); 
    card.appendChild(price);

    const actions = el("div","actions");

       // ✅ Save ID to localStorage and go to details page (keeps behavior consistent with home)
    const details = el("button","btn");
    details.textContent = "View Details";
    details.addEventListener("click", () => {
      localStorage.setItem("selectedProductId", p.id);
      window.location.href = "product-details.html";
    });

    const contact = el("a","btn primary");
    const msg = encodeURIComponent(`Hello ${CONTACT.businessName}, I'm interested in ${p.name || p.brand+" "+p.model}. Please send price & availability.`);
    contact.href = `https://wa.me/${CONTACT.whatsapp}?text=${msg}`; 
    contact.target="_blank"; 
    contact.rel="noopener"; 
    contact.textContent = "Contact (WA)";

    const favBtn = el("button","btn"); 
    favBtn.textContent = favs.has(p.id) ? "Saved" : "Save";
    favBtn.addEventListener("click", ()=>{
      const set = getFavs();
      if(set.has(p.id)) set.delete(p.id); else set.add(p.id);
      saveFavs(set);
      favBtn.textContent = set.has(p.id) ? "Saved" : "Save";
    });

    actions.appendChild(details); 
    actions.appendChild(contact); 
    actions.appendChild(favBtn);
    card.appendChild(actions);

    grid.appendChild(card);
  });
}


    function applyFilters(){
  const term = searchInput.value.trim().toLowerCase();
  const cat = categorySel.value.toLowerCase();   // normalize filter value
  let list = PRODUCTS.slice();

  if(cat !== "all"){
    list = list.filter(p => {
      // normalize product category (could be category or cat field)
      const prodCat = (p.category || p.cat || "").toLowerCase().trim();
      return prodCat === cat;
    });
  }

  if(term){
    list = list.filter(p =>
      `${p.name || p.brand+" "+p.model} ${p.brand} ${p.model || ""}`
        .toLowerCase()
        .includes(term)
    );
  }

  if(sortSel.value==="low") list.sort((a,b)=>a.price-b.price);
  else if(sortSel.value==="high") list.sort((a,b)=>b.price-a.price);
  else list.sort((a,b)=>b.created - a.created);

  render(list);
}



    // Wire events
    searchInput.addEventListener("input", applyFilters);
    categorySel.addEventListener("change", applyFilters);
    sortSel.addEventListener("change", applyFilters);

    // Footer & float contacts
    function wireContacts(){
      const baseMsg = encodeURIComponent(`Hello ${CONTACT.businessName}, I want to order.`);
      document.getElementById("waFooter").href = `https://wa.me/${CONTACT.whatsapp}?text=${baseMsg}`;
      document.getElementById("telFooter").href = `tel:${CONTACT.phone}`;
      document.getElementById("mailFooter").href = `mailto:${CONTACT.email}`;
      const waFloat = document.getElementById("waFloat"); waFloat.href = `https://wa.me/${CONTACT.whatsapp}?text=${baseMsg}`;
    }

    document.getElementById("yr").textContent = new Date().getFullYear();
    wireContacts();
    applyFilters();

    // Sync favorites changes across tabs
    window.addEventListener("storage", (e) => {
      if (e.key && e.key.startsWith("favorites_")) {
        applyFilters();
      }
    });

    // Build nav dynamically
  function buildNav(user) {
    const navLinks = document.getElementById("navLinks");
    navLinks.innerHTML = `
      <a href="index.html">Home 🏠︎</a>
      <a href="PAYLESS4TECH-shop.html">Shop 𖠩</a>
      <a href="favorites.html" id="favLink">Favorites ★</a>
      <a href="about.html">About ⓘ</a>
    `;

    if (user) {
      if (user.role === "admin") {
        navLinks.innerHTML += `<a href="PAYLESS4TECH-Admin-dashboard.html">Admin Dashboard 🛡️</a>`;
      } else {
        navLinks.innerHTML += `<a href="PAYLESS4TECH-Useraccount.html">Profile 𖨆</a>`;
      }
      navLinks.innerHTML += `<a href="#" onclick="logout()">Logout ⤷</a>`;
    } else {
      navLinks.innerHTML += `<a href="PAYLESS4TECH-Account.html">Account 👤</a>`;
    }

    // Highlight active page
    const current = window.location.pathname.split("/").pop();
    [...navLinks.querySelectorAll("a")].forEach(link => {
      if (link.getAttribute("href") === current || 
          (link.getAttribute("href") === "#" && current === "")) {
        link.classList.add("active");
      }
    });
  }

    // Run after DOM loads
document.addEventListener("DOMContentLoaded", () => {
  const user = JSON.parse(localStorage.getItem("paylessUser"));
  buildNav(user);

  // Mobile toggle — match CSS (.nav-links.show) and keep aria-expanded in sync
  const menuToggle = document.getElementById("menuToggle");
  const navLinks = document.getElementById("navLinks");
  if (menuToggle && navLinks) {
    menuToggle.addEventListener("click", () => {
      const expanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!expanded));
      navLinks.classList.toggle("show");
    });
  }
});



  // Logout function
  function logout() {
    localStorage.removeItem("paylessUser");
    alert("Logged out!");
    window.location.href = "index.html";
  }
  </script>
</body>
</html>
