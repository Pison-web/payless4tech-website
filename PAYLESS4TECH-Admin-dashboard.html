<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
   <!-- Add this in your <head> to load the icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
  <title>Admin Dashboard</title>
  <style>
   body {
  font-family: Arial, sans-serif;
  background: #111631;
  background-size: cover;
  color: #021731;
  flex-direction: column;
  margin: 0;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }  /* stops horizontal creep */

/* ===== Header / Nav ===== */
header {
  background: rgba(11,16,32,.75);
  color: #fff;
  display: flex;
  backdrop-filter: blur(10px);
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  position: fixed;  
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;      /* make sure it’s above other content */
}

header .logo {
  font-size: 22px;
  font-weight: bold;
}

header .logo span {
  color: #ffcc00;
}

nav {
  display: flex;
}

nav a {
  color: #fff;
  margin-left: 20px;
  text-decoration: none;
  font-size: 16px;
}

nav a.active {
  border-bottom: 2px solid #ffcc00;
  padding-bottom: 2px;
}

/* Hamburger (hidden on desktop) */
.hamburger {
  display: none;
  flex-direction: column;
  cursor: pointer;
  padding: 8px;
  margin-left: auto;
  z-index: 1100;
}
.hamburger div {
  width: 25px;
  height: 3px;
  background: #fff;
  margin: 4px 0;
  border-radius: 2px;
}

/* Mobile nav (hidden by default) */
.mobile-nav {
  display: none;
  flex-direction: column;
  position: fixed;
  top: 60px;
  right: 16px;
  width: min(220px, calc(100vw - 32px));
  background: #0b3d91;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 12px 24px rgba(0,0,0,.35);
  z-index: 1100;
}
.mobile-nav a {
  color: #fff;
  margin: 10px 0;
  text-decoration: none;
  font-size: 16px;
  white-space: nowrap;
}

footer {
  background: #0b3d91;
  color: white;
  text-align: center;
  padding: 1rem;
  margin-top: 30px;
}

/* Responsive behavior */
@media (max-width: 768px) {
  nav {
    display: none;
  }
  .hamburger {
    display: flex;
  }
}

/* ===== Sidebar ===== */
.sidebar {
  width: 70px; /* collapsed by default */
  background: #111631;
  color: white;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 60px; /* sit under header */
  padding: 15px 10px;
  transition: width 0.3s ease;
  overflow: hidden;
  z-index: 999;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.sidebar.expanded {
  width: 220px; /* expanded */
  align-items: flex-start;
}

.sidebar-toggle {
  align-self: flex-end;
  cursor: pointer;
  margin-bottom: 20px;
  color: #fff;
  font-size: 18px;
}

.sidebar-title {
  text-align: center;
  margin: 10px 0 30px;
  font-size: 16px;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.sidebar.expanded .sidebar-title {
  opacity: 1;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  transition: background 0.2s;
}
.sidebar button i {
  min-width: 24px;
  text-align: center;
  font-size: 16px;
}

.btn-text {
  margin-left: 10px;
  opacity: 0;
  white-space: nowrap;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.sidebar.expanded .btn-text {
  opacity: 1;
  transform: translateX(0);
}

.sidebar button:hover {
  background: #6ea8fe;
  color: #111631;
}

/* ===== Main content shifts with sidebar ===== */
.main {
  margin-left: 90px; /* collapsed width */
  transition: margin-left 0.3s ease;
  padding: 20px;
  margin-top: 120px; /* below header */
}
.sidebar.expanded ~ .main {
  margin-left: 240px; /* expanded width */
}

/* ===== Mobile Fix ===== */
@media (max-width: 768px) {
  .sidebar {
    position: relative;
    width: 100%;
    height: auto;
    top: 0;
    margin: 0;
    padding-top: 70px;
  }
  .sidebar .btn-text,
  .sidebar-title {
    opacity: 1; /* always show text on phone */
  }
  .sidebar-toggle {
    display: none; /* no toggle button on phone */
  }
  .main {
    margin-left: 0;
    width: 100%;
    margin-top: 20px;
  }
}

/* ===== Upload form ===== */
.upload-form {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  margin-bottom: 30px;
}
.upload-form input, .upload-form textarea {
  width: 100%;
  margin: 10px 0;
  padding: 8px;
  border-radius: 5px;
  border: 1px solid #ccc;
  font-size: 14px;
}
.upload-form button {
  background: #36d399;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 5px;
  cursor: pointer;
}
.upload-form button:hover {
  background: #28b17b;
}
.preview {
  margin-top: 10px;
}
.preview img {
  max-width: 150px;
  border-radius: 10px;
  margin-top: 10px;
}

/* ===== Products table ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
th, td {
  padding: 12px;
  border-bottom: 1px solid #ddd;
  text-align: center;
}
th {
  background: #111631;
  color: white;
}
tr:hover {
  background: #f9f9f9;
}
.action-btn {
  border: none;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  margin: 2px;
}
.edit { background: #6ea8fe; color: white; }
.delete { background: #ff6b6b; color: white; }
.save { background: #36d399; color: white; }
.cancel { background: #b8c1d1; color: black; }
 
  </style>
</head>
<body>
  <!-- ===== Header / Nav ===== -->
<header>
  <div class="logo">PAYLESS<span>4TECH</span></div>

  <!-- Desktop Nav -->
  <nav id="mainNav"></nav>

  <div class="hamburger" onclick="toggleMenu()">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobileNav"></div>
</header>
<!-- Sidebar -->
<div class="sidebar collapsed" id="sidebar">
  <div class="sidebar-toggle" id="sidebarToggle">
    <i class="fas fa-bars"></i>
  </div>
  <h2 class="sidebar-title">ADMIN</h2>

  <button onclick="showSection('upload')">
    <i class="fas fa-upload"></i>
    <span class="btn-text">Upload Product</span>
  </button>

  <button onclick="showSection('products')">
    <i class="fas fa-boxes"></i>
    <span class="btn-text">Manage Products</span>
  </button>

  <button onclick="showSection('profile')">
    <i class="fas fa-user"></i>
    <span class="btn-text">Profile 👤</span>
  </button>

  <button onclick="showSection('admins')">
    <i class="fas fa-user-shield"></i>
    <span class="btn-text">Manage Admins 🛡️</span>
  </button>

  <button onclick="logout()">
    <i class="fas fa-sign-out-alt"></i>
    <span class="btn-text">Logout</span>
  </button>
</div>



  <div class="main">
    <h1 style="color: white;">Admin Dashboard</h1>

    <!-- Upload Form -->
    <div id="upload" class="upload-form">
      <h2>Upload Product</h2>
      <input type="text" id="productName" placeholder="Product Name">
      <textarea id="productDesc" placeholder="Product Description"></textarea>
      <select id="productCategory" required>
  <option value="">Select Category</option>
  <option value="Laptop">Laptop</option>
  <option value="Accessory">Accessory</option>
  <option value="Phones">Phones</option>
  <option value="Battery">Battery</option>
  <option value="RAM">RAM</option>
</select>

      <input type="number" id="productPrice" placeholder="Price GHS">
      <input type="file" id="productImages" accept="image/*" multiple>
      <div class="preview" id="preview"></div>
      <button onclick="addProduct()">Submit Product</button>
    </div>

    <!-- Product Table -->
    <div id="products" style="display:none;">
      <h2>All Products</h2>
      <table id="productTable">
<thead>
  <tr>
    <th>Image</th>
    <th>Name</th>
    <th>Description</th>
    <th>Price</th>
    <th>Category</th>
    <th>Posted By</th>
    <th>Date Posted</th>
    <th>Actions</th>
  </tr>
</thead>


        <tbody></tbody>
      </table>
    </div>

    <!-- Admin Profile Section -->
<div id="profile" style="display:none; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
  <h2>Admin Profile</h2>
  <p><strong>Email:</strong> <span id="adminEmail"></span></p>
  <p><strong>Username:</strong> <span id="adminUsername"></span></p>
  <p><strong>Role:</strong> <span id="adminRole"></span></p>
  <p><strong>Phone:</strong> <span id="adminPhone"></span></p>
</div><!-- Manage Admins Section (only super admin sees this) -->
<div id="admins" style="display:none; background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
  <h2>Manage Admins</h2>
  <table id="adminTable">
    <thead>
      <tr>
        <th>Email</th>
        <th>Username</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
  </div>

  <!-- ===== Footer Placeholder ===== -->
<div id="footer-placeholder"></div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("sidebarToggle");

    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("expanded");
    });
  });
</script>

  <script>
let products = []; // ✅ Global so all functions can use it
let productTableBody, previewDiv;

document.addEventListener("DOMContentLoaded", () => {
  // ✅ Secure access: only allow admins
  const user = JSON.parse(localStorage.getItem("paylessUser"));
  if (!user || user.role !== "admin") {
    window.location.href = "PAYLESS4TECH-Account.html";
    return;
  }

  // ✅ Hide Manage Admins if not superadmin
  if (user.email !== "superadmin@payless.com") {
    document.querySelector("button[onclick=\"showSection('admins')\"]").style.display = "none";
  }

  // ✅ Cache DOM elements
  productTableBody = document.querySelector("#productTable tbody");
  previewDiv = document.getElementById("preview");

  // ✅ Load products
  products = JSON.parse(localStorage.getItem("paylessProducts") || "[]");
  renderProducts();

  // ✅ Preview Multiple Images
  document.getElementById("productImages").addEventListener("change", function () {
    previewDiv.innerHTML = "";
    [...this.files].forEach(file => {
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.style.width = "60px";
        img.style.margin = "5px";
        previewDiv.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  // ✅ Build nav dynamically
  const mainNav = document.getElementById("mainNav");
  const mobileNav = document.getElementById("mobileNav");
  buildNav(mainNav, user);
  buildNav(mobileNav, user);
});

// ---------- Add Product ----------
function addProduct() {
  const name = document.getElementById("productName").value.trim();
  const desc = document.getElementById("productDesc").value.trim();
  const price = document.getElementById("productPrice").value.trim();
  const category = document.getElementById("productCategory").value.trim();
  const imageInput = document.getElementById("productImages");

  if (!name || !desc || !price || !category || !imageInput.files.length) {
    alert("Please fill all fields (including category) and select at least one image.");
    return;
  }

  let images = [];
  let filesProcessed = 0;

  // Read files as data-urls
  [...imageInput.files].forEach(file => {
    const reader = new FileReader();
    reader.onload = function (e) {
      images.push(e.target.result);
      filesProcessed++;
      if (filesProcessed === imageInput.files.length) {
        // current admin
        const currentUser = JSON.parse(localStorage.getItem("paylessUser")) || {};
        const humanDate = new Date().toLocaleString();

        const product = {
          id: "p" + Date.now() + "_" + Math.floor(Math.random() * 1000),
          name,
          desc,
          category,
          price: parseFloat(price),
          currency: "GHS",
          images,
          created: Date.now(),                 // numeric timestamp
          createdBy: currentUser.email || currentUser.username || "unknown",
          createdAt: humanDate                 // human readable
        };

        // persist
        products.push(product);
        localStorage.setItem("paylessProducts", JSON.stringify(products));
        alert("✅ Product uploaded successfully!");
        showSection("products");
        renderProducts();
        clearForm();
      }
    };
    reader.readAsDataURL(file);
  });
}

// ---------- Render Products ----------
function renderProducts() {
  productTableBody.innerHTML = "";
  products = JSON.parse(localStorage.getItem("paylessProducts") || "[]"); // always reload

  products.forEach((p, index) => {
    const descText = p.description || p.desc || "";
    // fallback values
    const postedBy = p.createdBy || p.createdByEmail || "—";
    const createdAt = p.createdAt || (p.created ? new Date(p.created).toLocaleString() : "—");
    const imgSrc = (p.images && p.images[0]) || p.img || "images/placeholder.png";

    const row = document.createElement("tr");
    row.innerHTML = `
      <td><img src="${imgSrc}" width="60" alt=""></td>
      <td contenteditable="false">${p.name || ''}</td>
      <td contenteditable="false">${descText}</td>
      <td contenteditable="false">${p.price}</td>
      <td contenteditable="false">${p.category || ''}</td>
      <td contenteditable="false">${postedBy}</td>
      <td contenteditable="false">${createdAt}</td>
      <td>
        <button class="action-btn edit" onclick="editProduct(this, ${index})">Edit</button>
        <button class="action-btn delete" onclick="deleteProduct(${index})">Delete</button>
      </td>
    `;
    productTableBody.appendChild(row);
  });
}

// ---------- Render Admins ----------
function renderAdmins() {
  const adminTableBody = document.querySelector("#adminTable tbody");
  if (!adminTableBody) return;

  adminTableBody.innerHTML = "";
  let users = JSON.parse(localStorage.getItem("paylessUsers") || "[]");

  const current = JSON.parse(localStorage.getItem("paylessUser")) || {};
  const superAdminEmail = "superadmin@payless.com"; // 👈 your superadmin email

  users.filter(u => u.role === "admin").forEach((a) => {
    const row = document.createElement("tr");

    let actionCell = "";
    if (a.email === superAdminEmail) {
      actionCell = "<em>(Super Admin)</em>";
    } else if (current.email === a.email) {
      actionCell = "<em>(you)</em>";
    } else {
      actionCell = `<button class="action-btn delete" onclick="deleteAdmin('${a.email}')">Delete</button>`;
    }

    row.innerHTML = `
      <td>${a.email}</td>
      <td>${a.username || "N/A"}</td>
      <td>${a.phone || "N/A"}</td>
      <td>${actionCell}</td>
    `;
    adminTableBody.appendChild(row);
  });
}


// ---------- Edit Product ----------
function editProduct(button, index) {
  const row = button.closest("tr");
  const cells = row.querySelectorAll("td");

  if (button.textContent === "Edit") {
    cells[1].contentEditable = true; // Name
    cells[2].contentEditable = true; // Desc
    cells[3].contentEditable = true; // Price

    const currentCategory = cells[4].textContent.trim();
    cells[4].innerHTML = `
      <select class="editCategory">
        <option value="Laptop" ${currentCategory === "Laptop" ? "selected" : ""}>Laptop</option>
        <option value="Accessory" ${currentCategory === "Accessory" ? "selected" : ""}>Accessory</option>
        <option value="Phones" ${currentCategory === "Phones" ? "selected" : ""}>Phones</option>
        <option value="Battery" ${currentCategory === "Battery" ? "selected" : ""}>Battery</option>
        <option value="RAM" ${currentCategory === "RAM" ? "selected" : ""}>RAM</option>
      </select>
    `;
    button.textContent = "Save";
  } else {
    products[index].name = cells[1].textContent.trim();
    products[index].desc = cells[2].textContent.trim();
    products[index].price = parseFloat(cells[3].textContent.trim()) || 0;
    products[index].category = row.querySelector(".editCategory").value;

    localStorage.setItem("paylessProducts", JSON.stringify(products));
    alert("✅ Product updated!");
    renderProducts();
  }
}

// ---------- Delete Product ----------
function deleteProduct(index) {
  if (confirm("Delete this product?")) {
    products.splice(index, 1);
    localStorage.setItem("paylessProducts", JSON.stringify(products));
    renderProducts();
  }
}
// ---------- Delete Admin ----------
function deleteAdmin(email) {
  const currentUser = JSON.parse(localStorage.getItem("paylessUser"));

  // ✅ Only super admin can delete admins
  if (!currentUser || currentUser.email !== "superadmin@payless.com") {
    alert("❌ Only the Super Admin can delete admins.");
    return;
  }

  let users = JSON.parse(localStorage.getItem("paylessUsers") || "[]");
  const index = users.findIndex(u => u.email === email && u.role === "admin");

  if (index !== -1) {
    if (confirm(`Are you sure you want to delete admin: ${email}?`)) {
      users.splice(index, 1);
      localStorage.setItem("paylessUsers", JSON.stringify(users));
      alert("✅ Admin deleted successfully!");
      renderAdmins(); // refresh list
    }
  } else {
    alert("⚠️ Admin not found or already deleted.");
  }
}


// ---------- Helpers ----------
function clearForm() {
  document.getElementById("productName").value = "";
  document.getElementById("productDesc").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productCategory").value = "";
  document.getElementById("productImages").value = "";
  previewDiv.innerHTML = "";
}


function showSection(section) {
  const user = JSON.parse(localStorage.getItem("paylessUser")) || {};

  // ✅ Block access to "admins" section if not superadmin
  if (section === "admins" && user.email !== "superadmin@payless.com") {
    alert("❌ Only the Super Admin can access Manage Admins.");
    return;
  }

  // hide all admin panes
  const panes = ["upload","products","profile","admins"];
  panes.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  });

  // show the requested pane
  const target = document.getElementById(section);
  if (target) target.style.display = "block";

  // If it's profile, load admin data
  if (section === "profile") {
    const admin = JSON.parse(localStorage.getItem("paylessUser"));
    if (admin) {
      document.getElementById("adminEmail").innerText = admin.email || "N/A";
      document.getElementById("adminUsername").innerText = admin.username || "N/A";
      document.getElementById("adminRole").innerText = admin.role || "admin";
      document.getElementById("adminPhone").innerText = admin.phone || "N/A";
    }
  }

  // If it's admins, render admins list
  if (section === "admins") {
    renderAdmins();
  }
}


function toggleMenu() {
  const nav = document.getElementById("mobileNav");
  nav.style.display = nav.style.display === "flex" ? "none" : "flex";
}

function buildNav(container, user) {
  container.innerHTML = `
    <a href="index.html">Home 🏠︎</a>
    <a href="PAYLESS4TECH-shop.html">Shop 𖠩</a>
    <a href="favorites.html">Favorites ★</a>
    <a href="about.html">About ⓘ</a>
  `;
  if (user) {
    if (user.role === "admin") {
      container.innerHTML += `<a href="PAYLESS4TECH-Admin-dashboard.html">Admin Dashboard 🛡️</a>`;
    } else {
      container.innerHTML += `<a href="PAYLESS4TECH-Useraccount.html">Profile 𖨆</a>`;
    }
    container.innerHTML += `<a href="#" onclick="logout()">Logout ⤷</a>`;
  } else {
    container.innerHTML += `<a href="PAYLESS4TECH-Account.html">Account 👤</a>`;
  }
}

function logout() {
  localStorage.removeItem("paylessUser");
  alert("Logged out!");
  window.location.href = "index.html";
}

fetch("footer.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("footer-placeholder").innerHTML = data;
    })
    .catch(error => console.error("Error loading footer:", error));

// ✅ Keep admin UI in sync if products change in another tab
window.addEventListener("storage", (e) => {
  if (e.key === "paylessProducts") {
    products = JSON.parse(e.newValue || "[]");
    renderProducts();
  }
});

</script>

</body>
</html>
